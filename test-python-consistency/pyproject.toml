# Modern Python packaging
[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-python-consistency"
version = "0.1.0"
description = "Python project for testing prompt consistency"
python-requires = ">=3.8"
dependencies = [
    "requests>=2.31.0",
]

[tool.black]
line-length = 120
target-version = ['py38']

[tool.flake8]
max-line-length = 120